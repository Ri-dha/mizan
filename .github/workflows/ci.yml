name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (Java 25, Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: api/pom.xml
      - run: ./mvnw -B test
        working-directory: api
