# Local development. Every value has a localhost default matching docker-compose.yml; with
# spring-boot-docker-compose on the classpath the compose stack is started automatically.
spring:
  docker:
    compose:
      file: ../docker-compose.yml
      lifecycle-management: start_only
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mizan}
    username: ${DB_USERNAME:mizan}
    password: ${DB_PASSWORD:mizan}
    hikari:
      pool-name: mizan-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}

springdoc:
  swagger-ui:
    enabled: true

mizan:
  web:
    allowed-origins: ${MIZAN_ALLOWED_ORIGINS:http://localhost:5173}

  # No provider keys locally: fixed prices so the metals screens have numbers to show.
  market:
    stub:
      enabled: true
      prices-micros:
        XAU: 2650000000
        XAG: 31500000
        USDIQD_OFFICIAL: 1310000000
        USDIQD_PARALLEL: 1470000000
        # Local market, IQD micros per gram of pure metal: about 125,243 IQD/g gold, 1,480 IQD/g silver.
        XAU_LOCAL: 125243000000
        XAG_LOCAL: 1480000000
