# Deployed environments. Everything secret arrives through the environment; nothing here is
# a working default on its own.
spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: mizan-pool
      # One small instance: a few connections serve it, and each idle one costs Postgres memory.
      maximum-pool-size: ${DB_POOL_MAX:6}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}

springdoc:
  swagger-ui:
    enabled: false
  # The OpenAPI document is generated for `npm run api:types` against a local API, not served here.
  api-docs:
    enabled: ${OPENAPI_DOCS_ENABLED:false}

mizan:
  web:
    allowed-origins: ${MIZAN_ALLOWED_ORIGINS:}
  market:
    stub:
      enabled: false
