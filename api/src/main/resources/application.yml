spring:
  application:
    name: mizan
  http:
    client:
      # Outbound price-feed calls are bounded so a slow provider cannot hold the refresh thread.
      connect-timeout: 10s
      read-timeout: 10s
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:dev}"
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the mapping agrees with it.
      ddl-auto: validate
    open-in-view: false
  cache:
    type: caffeine
    # Shared price reads (MarketCache); cleared when a price is stored, expiring as a backstop.
    cache-names: market-quotes,market-history,market-changes
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s

# Appenders and profiles live in logback-spring.xml; these shape the JSON lines it writes:
# @timestamp, level, logger_name, thread_name, message, application, plus every MDC key
# (correlationId, httpMethod, httpPath, userId, traceId, spanId) as a top-level field.
logging:
  structured:
    json:
      add:
        application: mizan
      exclude:
        - "@version"
        - level_value

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      # Every request gets a trace id in its log lines; nothing is exported, so 1.0 costs nothing.
      probability: 1.0
  observations:
    key-values:
      application: mizan
  metrics:
    tags:
      application: mizan
    distribution:
      # A few fixed latency bands, not a full histogram: about 70 buckets per path and status
      # cost memory here and storage in VictoriaMetrics for detail nobody reads at this scale.
      slo:
        http.server.requests: 100ms,500ms,1s,5s
  # ADR obs-5: JVM, HTTP, Hikari, cache and IQWealth metrics at /actuator/prometheus, read by
  # VictoriaMetrics every 30 s; nothing is pushed.
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  swagger-ui:
    enabled: "${SWAGGER_UI_ENABLED:false}"
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    enabled: "${OPENAPI_DOCS_ENABLED:true}"

mizan:
  logging:
    # The JSON file Filebeat tails in local development; rolled by size and day.
    file: "${MIZAN_LOG_FILE:logs/mizan.json}"
    max-file-size: 50MB
    max-history: 7
    total-size-cap: 1GB
    requests:
      # Successful requests faster than this get a DEBUG access line; errors and slow ones INFO or above.
      slow-after: "${MIZAN_SLOW_REQUEST:1s}"

  api:
    problem:
      base-uri: "${MIZAN_PROBLEM_BASE_URI:https://api.mizan.iq/problems/}"

  security:
    jwt:
      secret: "${MIZAN_JWT_SECRET:dev-only-secret-change-me-in-every-real-environment}"
      issuer: "${MIZAN_JWT_ISSUER:mizan}"
      access-token-ttl: 15m
      refresh-token-ttl: 30d
    # Pepper for HMAC lookups of refresh tokens and verification codes. Dev default only.
    hash-pepper: "${MIZAN_HASH_PEPPER:dev-only-pepper-change-me}"

  auth:
    # Local numbers written as 07xx are normalised to E.164 with this prefix.
    default-country-code: "+964"
    lockout:
      max-attempts: 5
      duration: 15m
    verification:
      code-length: 6
      ttl: 10m
      max-attempts: 5
      resend-cooldown: 60s
    password-reset:
      # FR-ACC-02: single use, 30 minutes.
      ttl: 30m
    rate-limit:
      # Per client address on the unauthenticated auth endpoints (NFR-04).
      capacity: 20
      refill-period: 1m
    # FR-ACC-08: the account and its household are purged this long after the request.
    deletion:
      grace-period: 30d
      purge-cron: "0 45 3 * * *"

  # FR-NTF-01..06. VAPID keys identify this server to push services; leave blank in dev and a
  # pair is generated at startup (subscriptions then last until the next restart).
  notifications:
    enabled: ${MIZAN_NOTIFICATIONS_ENABLED:true}
    transport: ${MIZAN_NOTIFICATIONS_TRANSPORT:webpush}
    # Devices schedule reminders (ADR e2e-1); this is how often due ones are sent.
    dispatch-interval: 5m
    # A reminder this late is dropped rather than sent.
    stale-after: 6h
    metal-cron: "0 0 9 * * *"
    time-zone: ${MIZAN_TIME_ZONE:Asia/Baghdad}
    ttl: 24h
    vapid:
      subject: ${MIZAN_VAPID_SUBJECT:mailto:admin@mizan.iq}
      public-key: ${MIZAN_VAPID_PUBLIC_KEY:}
      private-key: ${MIZAN_VAPID_PRIVATE_KEY:}
    expo:
      url: ${MIZAN_EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
      access-token: ${MIZAN_EXPO_ACCESS_TOKEN:}

  household:
    default-currency: IQD
    default-month-start-day: 1
    invitation:
      # FR-ACC-05: an invitation link stops working after this.
      ttl: 7d
    deletion:
      # FR-ACC-07: household deletion needs the owner's password and waits this long.
      grace-period: 7d
      purge-cron: "0 15 4 * * *"
    advisor:
      default-access-days: 30

  sync:
    pull-page-size: 500
    max-push-ops: 500
    # BR-15: how long a soft-deleted record can still be restored.
    recycle-bin-retention: 30d
    purge-cron: "0 30 3 * * *"
    # Receipts only stop a device's retry being applied twice; a retry later than this is still
    # recognised by its clocks. Superseded sync log entries go at the same time (ADR sync-2).
    receipt-retention: 30d
    housekeeping-cron: "0 40 3 * * *"

  # --- Market data (FR-MKT-01..06) ---
  # Providers are tried in order; each is only registered when its key is set. The stub
  # (dev/test) answers last with fixed prices. The parallel dollar rate has no public API, so
  # an operator supplies it in micros (1470 IQD/USD = 1470000000); 0 leaves it unset.
  market:
    # Feeds are called only on request (Refresh button, app load) unless auto-refresh is on.
    auto-refresh: "${MIZAN_MARKET_AUTO_REFRESH:false}"
    refresh-interval: 15m
    # T-price-history: every feed is polled on this schedule so price changes are recorded
    # (keyless sources by default; check a keyed provider's quota). "-" turns it off.
    poll-cron: "${MIZAN_MARKET_POLL_CRON:0 0/30 7-22 * * *}"
    poll-zone: Asia/Baghdad
    manual-refresh-cooldown: 30s
    stale-after: 24h
    history-default-days: 365
    history-max-days: 1830
    feeds:
      metals-dev:
        url: "${MIZAN_METALS_DEV_URL:https://api.metals.dev/v1/latest}"
        api-key: "${MIZAN_METALS_DEV_API_KEY:}"
      gold-api:
        url: "${MIZAN_GOLD_API_URL:https://www.goldapi.io}"
        api-key: "${MIZAN_GOLD_API_KEY:}"
      open-exchange-rates:
        url: "${MIZAN_OPEN_EXCHANGE_RATES_URL:https://openexchangerates.org}"
        app-id: "${MIZAN_OPEN_EXCHANGE_RATES_APP_ID:}"
      exchange-rate-api:
        url: "${MIZAN_EXCHANGE_RATE_API_URL:https://open.er-api.com}"
      # The local market: Baghdad Bullion House publishes bid and ask per gram in IQD and a product list.
      baghdad-bullion:
        url: "${MIZAN_BAGHDAD_BULLION_URL:https://prices.baghdadbullionhouse.com/api/prices}"
        enabled: "${MIZAN_BAGHDAD_BULLION_ENABLED:true}"
      # Keyless spot in USD per troy ounce; keyed providers above answer first when configured.
      gold-api-com:
        url: "${MIZAN_GOLD_API_COM_URL:https://api.gold-api.com}"
        enabled: "${MIZAN_GOLD_API_COM_ENABLED:true}"
      parallel-rate-iqd-micros: "${MIZAN_PARALLEL_RATE_IQD_MICROS:0}"
      # IQWealth (iraqsm.com): the Baghdad market and Central Bank dollar, ahead of the sources above.
      # Free keys allow 100 requests a day for personal, non-commercial use and require the
      # "Data: IQWealth" credit; anything public needs their Business plan. Blank key: off.
      # The dollar crons spend 59 a day (56 by day, 3 at night) and gold 4 more; the reserve is
      # never spent by polling.
      # ADR prices-3: which feed answers gold first (iraqsm.com or baghdadbullionhouse.com); the
      # rest follow as fallbacks. Operators change it in the dashboard.
      gold-primary: "${MIZAN_GOLD_PRIMARY:iraqsm.com}"
      iq-wealth:
        url: "${MIZAN_IQWEALTH_URL:https://iraqsm.com/api/v1}"
        api-key: "${MIZAN_IQWEALTH_API_KEY:}"
        parallel-side: "${MIZAN_IQWEALTH_PARALLEL_SIDE:MID}"
        reserve: 30
        zone: Asia/Baghdad
        day-cron: "0 0/15 8-21 * * *"
        night-cron: "0 0 23,2,5 * * *"
        # ADR prices-4: the dealer buying price derived below IQWealth's gram, in basis points (100 = 1%).
        gold-bid-margin-bp: "${MIZAN_IQWEALTH_GOLD_BID_MARGIN_BP:100}"
        # IQWealth publishes gold once a day; four reads catch it soon after it changes.
        gold-cron: "0 5 8,12,16,20 * * *"
      # Phase 4: the local market's own quote. Any JSON endpoint; e.g. {"gold21": 547000} with
      # gold-path=gold21 and gold-unit=MITHQAL_21K. Registered only when the URL is set.
      local-dealer:
        url: "${MIZAN_LOCAL_DEALER_URL:}"
        gold-path: "${MIZAN_LOCAL_DEALER_GOLD_PATH:gold}"
        gold-unit: "${MIZAN_LOCAL_DEALER_GOLD_UNIT:MITHQAL_21K}"
        silver-path: "${MIZAN_LOCAL_DEALER_SILVER_PATH:}"
        silver-unit: "${MIZAN_LOCAL_DEALER_SILVER_UNIT:GRAM_999}"
    stub:
      enabled: false
      prices-micros: {}

  storage:
    bucket: "${MIZAN_STORAGE_BUCKET:mizan-attachments}"
    endpoint: "${MIZAN_STORAGE_ENDPOINT:http://localhost:8333}"
    # The address in upload and download links, e.g. https://mizan.example.iq when Caddy forwards
    # /mizan-attachments/* to storage. Blank: links use the endpoint above (local development).
    public-endpoint: "${MIZAN_STORAGE_PUBLIC_ENDPOINT:}"
    region: "${MIZAN_STORAGE_REGION:us-east-1}"
    access-key: "${MIZAN_STORAGE_ACCESS_KEY:mizan}"
    secret-key: "${MIZAN_STORAGE_SECRET_KEY:mizan-dev-secret}"
    path-style: true
    create-bucket-on-startup: "${MIZAN_STORAGE_CREATE_BUCKET:true}"
    # How long a presigned upload or download URL stays valid.
    url-ttl: 15m
    # Objects of attachments past the recycle-bin window go shortly before the row purge.
    object-purge-cron: "0 15 3 * * *"
    # ADR storage-2: receipt photos are deleted this long after upload; the app tells people so.
    receipt-retention: "${MIZAN_RECEIPT_RETENTION:30d}"
    receipt-expiry-cron: "0 0 3 * * *"

  web:
    allowed-origins: "${MIZAN_ALLOWED_ORIGINS:}"

  # --- Operators (ADR admin-1) ---
  # The first operator: an existing account's email or phone, granted at start-up. Later
  # operators are granted from the dashboard. Changes need the password again within elevation.
  admin:
    bootstrap-operator: "${MIZAN_BOOTSTRAP_OPERATOR:}"
    elevation: 10m

  # Secret settings changed from the dashboard are encrypted under this key (32 random bytes,
  # base64). Without it, secrets can only come from the environment.
  platform:
    settings-key: "${MIZAN_SETTINGS_KEY:}"

