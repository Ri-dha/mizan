spring:
  application:
    name: mizan
  http:
    client:
      # Outbound price-feed calls are bounded so a slow provider cannot hold the refresh thread.
      connect-timeout: 10s
      read-timeout: 10s
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:dev}"
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the mapping agrees with it.
      ddl-auto: validate
    open-in-view: false
  cache:
    type: caffeine

# One JSON object per line, Logstash style: @timestamp, level, logger_name, thread_name, message,
# application, plus every MDC key (correlationId, httpMethod, httpPath, userId, traceId, spanId)
# as a top-level field. Filebeat ships it to Elasticsearch; Kibana searches it as is.
logging:
  structured:
    format:
      console: "${MIZAN_LOG_FORMAT:logstash}"
      file: logstash
    json:
      add:
        application: mizan
      exclude:
        - "@version"
        - level_value
  file:
    # Filebeat tails this in local development, where the API runs outside Docker.
    name: "${MIZAN_LOG_FILE:logs/mizan.json}"
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      # Every request gets a trace id in its log lines; nothing is exported, so 1.0 costs nothing.
      probability: 1.0
  observations:
    key-values:
      application: mizan
  metrics:
    tags:
      application: mizan
    distribution:
      percentiles-histogram:
        http.server.requests: true
  elastic:
    metrics:
      export:
        # JVM, HTTP, Hikari and cache metrics into mizan-metrics-* for the Kibana performance panels.
        enabled: "${MIZAN_METRICS_ELASTIC_ENABLED:false}"
        host: "${MIZAN_ELASTICSEARCH_URL:http://localhost:9200}"
        index: mizan-metrics
        index-date-format: yyyy-MM-dd
        step: 30s
        auto-create-index: true

springdoc:
  swagger-ui:
    enabled: "${SWAGGER_UI_ENABLED:false}"
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    enabled: "${OPENAPI_DOCS_ENABLED:true}"

mizan:
  api:
    problem:
      base-uri: "${MIZAN_PROBLEM_BASE_URI:https://api.mizan.iq/problems/}"

  security:
    jwt:
      secret: "${MIZAN_JWT_SECRET:dev-only-secret-change-me-in-every-real-environment}"
      issuer: "${MIZAN_JWT_ISSUER:mizan}"
      access-token-ttl: 15m
      refresh-token-ttl: 30d
    # Pepper for HMAC lookups of refresh tokens and verification codes. Dev default only.
    hash-pepper: "${MIZAN_HASH_PEPPER:dev-only-pepper-change-me}"

  auth:
    # Local numbers written as 07xx are normalised to E.164 with this prefix.
    default-country-code: "+964"
    lockout:
      max-attempts: 5
      duration: 15m
    verification:
      code-length: 6
      ttl: 10m
      max-attempts: 5
      resend-cooldown: 60s
    password-reset:
      # FR-ACC-02: single use, 30 minutes.
      ttl: 30m
    rate-limit:
      # Per client address on the unauthenticated auth endpoints (NFR-04).
      capacity: 20
      refill-period: 1m
    # FR-ACC-08: the account and its household are purged this long after the request.
    deletion:
      grace-period: 30d
      purge-cron: "0 45 3 * * *"

  # FR-NTF-01..06. VAPID keys identify this server to push services; leave blank in dev and a
  # pair is generated at startup (subscriptions then last until the next restart).
  notifications:
    enabled: ${MIZAN_NOTIFICATIONS_ENABLED:true}
    transport: ${MIZAN_NOTIFICATIONS_TRANSPORT:webpush}
    daily-cron: "0 0 8 * * *"
    time-zone: ${MIZAN_TIME_ZONE:Asia/Baghdad}
    ttl: 24h
    vapid:
      subject: ${MIZAN_VAPID_SUBJECT:mailto:admin@mizan.iq}
      public-key: ${MIZAN_VAPID_PUBLIC_KEY:}
      private-key: ${MIZAN_VAPID_PRIVATE_KEY:}
    defaults:
      bill-lead-days: 3
      overspend-threshold-basis-points: 9000
      metal-move-basis-points: 200

  household:
    default-currency: IQD
    default-month-start-day: 1
    invitation:
      # FR-ACC-05: an invitation link stops working after this.
      ttl: 7d
    deletion:
      # FR-ACC-07: household deletion needs the owner's password and waits this long.
      grace-period: 7d
      purge-cron: "0 15 4 * * *"
    advisor:
      default-access-days: 30

  # FR-PLN-02: the split a new household starts with. Shares are basis points (5500 = 55.0%).
  plan:
    default-buckets:
      - { name: Essentials, colour: "#88aaee", share-basis-points: 5500 }
      - { name: Guilt-free, colour: "#ffdc58", share-basis-points: 500 }
      - { name: Debt & invest, colour: "#ff6b6b", share-basis-points: 1000 }
      - { name: Short-term savings, colour: "#a3e635", share-basis-points: 1500 }
      - { name: Investing, colour: "#c4a1ff", share-basis-points: 1500 }

  sync:
    pull-page-size: 500
    max-push-ops: 500
    # BR-15: how long a soft-deleted record can still be restored.
    recycle-bin-retention: 30d
    purge-cron: "0 30 3 * * *"

  # --- Market data (FR-MKT-01..06) ---
  # Providers are tried in order; each is only registered when its key is set. The stub
  # (dev/test) answers last with fixed prices. The parallel dollar rate has no public API, so
  # an operator supplies it in micros (1470 IQD/USD = 1470000000); 0 leaves it unset.
  market:
    # Feeds are called only on request (Refresh button, app load) unless auto-refresh is on.
    auto-refresh: "${MIZAN_MARKET_AUTO_REFRESH:false}"
    refresh-interval: 15m
    manual-refresh-cooldown: 30s
    stale-after: 24h
    history-default-days: 365
    history-max-days: 1830
    feeds:
      metals-dev:
        url: "${MIZAN_METALS_DEV_URL:https://api.metals.dev/v1/latest}"
        api-key: "${MIZAN_METALS_DEV_API_KEY:}"
      gold-api:
        url: "${MIZAN_GOLD_API_URL:https://www.goldapi.io}"
        api-key: "${MIZAN_GOLD_API_KEY:}"
      open-exchange-rates:
        url: "${MIZAN_OPEN_EXCHANGE_RATES_URL:https://openexchangerates.org}"
        app-id: "${MIZAN_OPEN_EXCHANGE_RATES_APP_ID:}"
      exchange-rate-api:
        url: "${MIZAN_EXCHANGE_RATE_API_URL:https://open.er-api.com}"
      # The local market: Baghdad Bullion House publishes bid and ask per gram in IQD and a product list.
      baghdad-bullion:
        url: "${MIZAN_BAGHDAD_BULLION_URL:https://prices.baghdadbullionhouse.com/api/prices}"
        enabled: "${MIZAN_BAGHDAD_BULLION_ENABLED:true}"
      # Keyless spot in USD per troy ounce; keyed providers above answer first when configured.
      gold-api-com:
        url: "${MIZAN_GOLD_API_COM_URL:https://api.gold-api.com}"
        enabled: "${MIZAN_GOLD_API_COM_ENABLED:true}"
      parallel-rate-iqd-micros: "${MIZAN_PARALLEL_RATE_IQD_MICROS:0}"
      # Phase 4: the local market's own quote. Any JSON endpoint; e.g. {"gold21": 547000} with
      # gold-path=gold21 and gold-unit=MITHQAL_21K. Registered only when the URL is set.
      local-dealer:
        url: "${MIZAN_LOCAL_DEALER_URL:}"
        gold-path: "${MIZAN_LOCAL_DEALER_GOLD_PATH:gold}"
        gold-unit: "${MIZAN_LOCAL_DEALER_GOLD_UNIT:MITHQAL_21K}"
        silver-path: "${MIZAN_LOCAL_DEALER_SILVER_PATH:}"
        silver-unit: "${MIZAN_LOCAL_DEALER_SILVER_UNIT:GRAM_999}"
    stub:
      enabled: false
      prices-micros: {}

  # --- Net worth (FR-NET-03) ---
  # The month that ended is snapshotted shortly after midnight; a month someone already closed
  # by hand is left alone.
  networth:
    auto-close-cron: "0 15 0 * * *"

  storage:
    bucket: "${MIZAN_STORAGE_BUCKET:mizan-attachments}"
    endpoint: "${MIZAN_STORAGE_ENDPOINT:http://localhost:9000}"
    region: "${MIZAN_STORAGE_REGION:us-east-1}"
    access-key: "${MIZAN_STORAGE_ACCESS_KEY:mizan}"
    secret-key: "${MIZAN_STORAGE_SECRET_KEY:mizan-dev-secret}"
    path-style: true
    create-bucket-on-startup: "${MIZAN_STORAGE_CREATE_BUCKET:true}"
    # How long a presigned upload or download URL stays valid.
    url-ttl: 15m
    # Objects of attachments past the recycle-bin window go shortly before the row purge.
    object-purge-cron: "0 15 3 * * *"

  web:
    allowed-origins: "${MIZAN_ALLOWED_ORIGINS:}"
