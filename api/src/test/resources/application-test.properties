spring.docker.compose.enabled=false

mizan.security.jwt.secret=test-secret-test-secret-test-secret-0123456789
mizan.security.jwt.issuer=mizan-test
mizan.security.jwt.access-token-ttl=15m
mizan.security.jwt.refresh-token-ttl=30d
mizan.security.hash-pepper=test-pepper

mizan.auth.rate-limit.capacity=1000
mizan.auth.rate-limit.refill-period=1m

mizan.storage.create-bucket-on-startup=false

# Fixture accounts used by the integration tests.
mizan.test.owner-email=owner@example.test
mizan.test.owner-password=owner-password-1
mizan.test.owner-phone=+9647700000001
mizan.test.other-email=other@example.test
mizan.test.other-password=other-password-1
