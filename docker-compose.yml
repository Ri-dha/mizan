# Local stack. `./mvnw spring-boot:run` in api/ starts postgres and minio through
# spring-boot-docker-compose; `docker compose --profile full up` also builds and runs the API.
#
# Ports are pinned so they match api/src/main/resources/application-dev.yml. Credentials are
# dev-only and applied when a volume is first created — after changing one, `docker compose
# down -v` forces a rebuild.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mizan}
      POSTGRES_USER: ${POSTGRES_USER:-mizan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mizan}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mizan} -d ${POSTGRES_DB:-mizan}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for receipt and asset photos. The API creates its bucket on
  # startup. Console on 9001.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mizan}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mizan-dev-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    profiles: ["full", "prod"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # dev inside Docker keeps the stub prices; set prod in .env for a real deployment.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mizan}
      DB_USERNAME: ${POSTGRES_USER:-mizan}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mizan}
      MIZAN_STORAGE_ENDPOINT: http://minio:9000
      MIZAN_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-mizan}
      MIZAN_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-mizan-dev-secret}
      MIZAN_JWT_SECRET: ${MIZAN_JWT_SECRET:-dev-only-secret-change-me-in-every-real-environment}
      MIZAN_HASH_PEPPER: ${MIZAN_HASH_PEPPER:-dev-only-pepper-change-me}
      MIZAN_ALLOWED_ORIGINS: ${MIZAN_ALLOWED_ORIGINS:-}
      MIZAN_PARALLEL_RATE_IQD_MICROS: ${MIZAN_PARALLEL_RATE_IQD_MICROS:-0}
      MIZAN_METALS_DEV_API_KEY: ${MIZAN_METALS_DEV_API_KEY:-}
      MIZAN_GOLD_API_KEY: ${MIZAN_GOLD_API_KEY:-}
      MIZAN_OPEN_EXCHANGE_RATES_APP_ID: ${MIZAN_OPEN_EXCHANGE_RATES_APP_ID:-}
      MIZAN_EXCHANGE_RATE_API_URL: ${MIZAN_EXCHANGE_RATE_API_URL:-https://open.er-api.com}
      MIZAN_GOLD_API_COM_ENABLED: ${MIZAN_GOLD_API_COM_ENABLED:-true}
      MIZAN_BAGHDAD_BULLION_URL: ${MIZAN_BAGHDAD_BULLION_URL:-https://prices.baghdadbullionhouse.com/api/prices}
      MIZAN_BAGHDAD_BULLION_ENABLED: ${MIZAN_BAGHDAD_BULLION_ENABLED:-true}
      MIZAN_MARKET_AUTO_REFRESH: ${MIZAN_MARKET_AUTO_REFRESH:-false}
      MIZAN_METRICS_ELASTIC_ENABLED: ${MIZAN_METRICS_ELASTIC_ENABLED:-true}
      MIZAN_ELASTICSEARCH_URL: http://elasticsearch:9200
      MIZAN_LOG_FILE: /dev/null
      MIZAN_LOCAL_DEALER_URL: ${MIZAN_LOCAL_DEALER_URL:-}
      MIZAN_LOCAL_DEALER_GOLD_PATH: ${MIZAN_LOCAL_DEALER_GOLD_PATH:-gold}
      MIZAN_LOCAL_DEALER_GOLD_UNIT: ${MIZAN_LOCAL_DEALER_GOLD_UNIT:-MITHQAL_21K}
      MIZAN_LOCAL_DEALER_SILVER_PATH: ${MIZAN_LOCAL_DEALER_SILVER_PATH:-}
      MIZAN_LOCAL_DEALER_SILVER_UNIT: ${MIZAN_LOCAL_DEALER_SILVER_UNIT:-GRAM_999}
      MIZAN_VAPID_SUBJECT: ${MIZAN_VAPID_SUBJECT:-mailto:admin@example.iq}
      MIZAN_VAPID_PUBLIC_KEY: ${MIZAN_VAPID_PUBLIC_KEY:-}
      MIZAN_VAPID_PRIVATE_KEY: ${MIZAN_VAPID_PRIVATE_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"

  # --- Production profile: `docker compose --profile prod up -d --build` ---
  # Caddy serves the built PWA, terminates TLS for SITE_ADDRESS and proxies /api to the API.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    profiles: ["prod"]
    depends_on:
      - api
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddydata:/data
      - caddyconfig:/config

  # Nightly pg_dump into MinIO. Runs once per start and sleeps a day; restart: always keeps
  # the cadence. Restore instructions are in docs/RUNBOOK.md.
  backup:
    build: ./infra/backup
    profiles: ["prod"]
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mizan}:${POSTGRES_PASSWORD:-mizan}@postgres:5432/${POSTGRES_DB:-mizan}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mizan}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mizan-dev-secret}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-mizan-backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}

  # --- Observability: `docker compose --profile observability up -d` (also part of prod) ---
  # Elasticsearch keeps the logs and metrics, Kibana shows them at http://localhost:5601. Single
  # node, security off: reach it over the Docker network or an SSH tunnel, never expose 9200/5601.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-9.3.3}
    profiles: ["observability", "prod"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-9.3.3}
    profiles: ["observability", "prod"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TELEMETRY_ENABLED: "false"
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:-change-me-to-32-or-more-characters!!}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:-change-me-to-32-or-more-characters!!}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:-change-me-to-32-or-more-characters!!}
    ports:
      - "127.0.0.1:5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 60

  # Data views and the "Mizan overview" dashboard; runs once and exits.
  kibana-setup:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-9.3.3}
    profiles: ["observability", "prod"]
    depends_on:
      kibana:
        condition: service_healthy
    environment:
      KIBANA_URL: http://kibana:5601
    volumes:
      - ./infra/observability/kibana:/setup:ro
    entrypoint: ["/bin/bash", "/setup/setup.sh"]

  # Container stdout (JSON from the API) and the local API log file into mizan-logs-*.
  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION:-9.3.3}
    profiles: ["observability", "prod"]
    user: root
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      LS_JAVA_OPTS: ${LS_JAVA_OPTS:--Xms256m -Xmx512m}
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_MONITORING_ENABLED: "false"
      PIPELINE_ECS_COMPATIBILITY: disabled
      # Root is needed to read other containers' log files.
      ALLOW_SUPERUSER: "true"
    volumes:
      - ./infra/observability/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./infra/observability/mizan-logs-template.json:/usr/share/logstash/templates/mizan-logs-template.json:ro
      - ./infra/observability/containers-logs-template.json:/usr/share/logstash/templates/containers-logs-template.json:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./api/logs:/logs/api:ro
      - logstashdata:/usr/share/logstash/data

  # CPU, memory, network and disk per container into metricbeat-*. Optional: `--profile containers`.
  metricbeat:
    image: docker.elastic.co/beats/metricbeat:${ELASTIC_VERSION:-9.3.3}
    profiles: ["containers"]
    user: root
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: ["metricbeat", "-e", "--strict.perms=false", "-system.hostfs=/hostfs"]
    volumes:
      - ./infra/observability/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/hostfs/proc:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /:/hostfs:ro
      - metricbeatdata:/usr/share/metricbeat/data

volumes:
  pgdata:
  esdata:
  logstashdata:
  metricbeatdata:
  miniodata:
  caddydata:
  caddyconfig:
