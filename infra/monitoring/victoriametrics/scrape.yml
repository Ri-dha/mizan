# ADR obs-5: what VictoriaMetrics reads every 30 s. %{...} is filled from the container's environment.
global:
  scrape_interval: 30s

scrape_configs:
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["%{API_METRICS_TARGET}"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: seaweedfs
    static_configs:
      - targets: ["seaweedfs:9327"]
  - job_name: host
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Only named containers; cAdvisor's per-cgroup and per-process series are noise here.
      - source_labels: [name]
        regex: ""
        action: drop
  - job_name: victoriametrics
    static_configs:
      - targets: ["localhost:8428"]
  - job_name: vmalert
    static_configs:
      - targets: ["vmalert:8880"]
