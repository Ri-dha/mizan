# Ships every container's stdout and the API's JSON log file to Elasticsearch. Lines that are
# JSON (the API) become fields; anything else (Postgres, MinIO, Caddy) stays as message.
input {
  file {
    path => "/var/lib/docker/containers/*/*.log"
    # Only what happens from now on; the directory also holds every stopped container's history.
    start_position => "end"
    sincedb_path => "/usr/share/logstash/data/sincedb-docker"
    codec => "json"
    type => "docker"
  }
  # The API running on the developer's machine, outside Docker.
  file {
    path => "/logs/api/*.json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-api"
    type => "api-local"
  }
}

filter {
  # Logstash's own warnings quote the events they are about; indexing them again would loop.
  if [type] == "docker" and [log] =~ /\]\[logstash\./ {
    drop { }
  }
  if [type] == "docker" {
    grok { match => { "path" => "/containers/(?<container_id>[^/]+)/" } }
    json { source => "log" skip_on_invalid_json => true }
    if ![logger_name] {
      mutate { rename => { "log" => "message" } }
    } else {
      mutate { remove_field => ["log"] }
    }
    mutate { remove_field => ["time"] }
  } else {
    json { source => "message" skip_on_invalid_json => true }
    mutate { add_field => { "container_id" => "api-local" } }
  }
  mutate { remove_field => ["path", "host", "event", "@version"] }
}

# The API's own lines go to mizan-logs-*; other containers' output, whatever shape it has, to
# containers-logs-*, so their fields can never collide with ours.
output {
  if [application] == "mizan" {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
      index => "mizan-logs-%{+YYYY.MM.dd}"
      template => "/usr/share/logstash/templates/mizan-logs-template.json"
      template_name => "mizan-logs"
      template_api => "composable"
      template_overwrite => true
      ecs_compatibility => disabled
    }
  } else {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
      index => "containers-logs-%{+YYYY.MM.dd}"
      template => "/usr/share/logstash/templates/containers-logs-template.json"
      template_name => "containers-logs"
      template_api => "composable"
      template_overwrite => true
      ecs_compatibility => disabled
    }
  }
}
